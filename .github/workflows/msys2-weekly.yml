name: Emacs MSYS2 Weekly Build

permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (UTC only; runs can be delayed/skipped on idle repos)
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref/SHA to build'
        default: 'master'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: ucrt64 }
    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    timeout-minutes: 120

    steps:

    - name: '⚙️ configure git core.autocrlf'
      shell: cmd
      run: git config --global core.autocrlf false
    - name: '⚙️ configure git core.eol'
      shell: cmd
      run: git config --global core.eol lf

    - name: '🧰 Checkout workflow repo'
      uses: actions/checkout@v6
      with:
        path: ci

    - name: '🧰 Checkout upstream Emacs'
      uses: actions/checkout@v6
      with:
        repository: emacs-mirror/emacs
        ref: ${{ inputs.upstream_ref || 'master' }}
        fetch-depth: 1
        path: emacs

    - name: '📌 Set EMACS_VERSION'
      shell: bash
      working-directory: ./emacs
      run: echo "EMACS_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: '${{ matrix.icon }} Setup MSYS2 UCRT64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        cache: true
        update: true
        install: >-
          git zip base-devel
          mingw-w64-ucrt-x86_64-autotools
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-xpm-nox
          mingw-w64-ucrt-x86_64-libtiff
          mingw-w64-ucrt-x86_64-giflib
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-libjpeg-turbo
          mingw-w64-ucrt-x86_64-librsvg
          mingw-w64-ucrt-x86_64-libwebp
          mingw-w64-ucrt-x86_64-lcms2
          mingw-w64-ucrt-x86_64-jansson
          mingw-w64-ucrt-x86_64-libgccjit
          mingw-w64-ucrt-x86_64-libxml2
          mingw-w64-ucrt-x86_64-gnutls
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-ctags
          mingw-w64-ucrt-x86_64-freetype
          mingw-w64-ucrt-x86_64-harfbuzz
          mingw-w64-ucrt-x86_64-cairo
          mingw-w64-ucrt-x86_64-libtree-sitter
          mingw-w64-ucrt-x86_64-sqlite3
          mingw-w64-ucrt-x86_64-libwinpthread
          mingw-w64-ucrt-x86_64-texinfo
          mingw-w64-ucrt-x86_64-ccache

    - name: '📦 Cache ccache'
      uses: actions/cache@v5
      with:
        path: D:\ccache
        key: ccache-${{ matrix.sys }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.sys }}-

    - name: '⚙️ Configure'
      env:
        CCACHE_DIR: 'D:\ccache'
      run: |
        set -e
        export CCACHE_DIR=/d/ccache
        cd ./emacs
        ./autogen.sh
        ./configure \
          --prefix=/c/emacs-${EMACS_VERSION} \
          --with-modules \
          --with-tree-sitter \
          --with-native-compilation \
          --with-gnutls \
          --without-dbus \
          --without-pop \
          CC="ccache gcc" \
          CFLAGS="-O2 -fno-optimize-sibling-calls"

    - name: '🚧 Make + Install'
      env:
        CCACHE_DIR: 'D:\ccache'
      run: |
        set -e
        export CCACHE_DIR=/d/ccache
        cd ./emacs
        make -j$(nproc)
        ccache -s
        make install -j$(nproc)

    - name: '📚 Pack runtime DLLs'
      run: |
        set -euo pipefail

        dlls=(
          "libXpm-nox4.dll"
          "libtiff-6.dll"
          "libgif-7.dll"
          "libpng16-16.dll"
          "libjpeg-8.dll"
          "librsvg-2-2.dll"
          "libwebp-7.dll"
          "libwebpdemux-2.dll"
          "liblcms2-2.dll"
          "libjansson-4.dll"
          "libgccjit-0.dll"
          "libxml2-16.dll"
          "libgnutls-30.dll"
          "zlib1.dll"
          "libfreetype-6.dll"
          "libharfbuzz-0.dll"
          "libcairo-2.dll"
          "libtree-sitter-0.27.dll"
          "libsqlite3-0.dll"
          "libwinpthread-1.dll"
        )

        cd "${MINGW_PREFIX}/bin"
        zip -9 "/c/emacs-ucrt64-dlls.zip" "${dlls[@]}"

    - name: '📦 Pack'
      working-directory: emacs
      run: |
        git --no-pager log -m --abbrev-commit --date=relative -10
        cd /c
        zip -r /c/emacs-${EMACS_VERSION}.zip emacs-${EMACS_VERSION}/*

    - name: '📤 Publish release'
      if: success()
      shell: pwsh
      working-directory: ./ci
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "emacs-$env:EMACS_VERSION" `
          "C:/emacs-$env:EMACS_VERSION.zip" `
          "C:/emacs-ucrt64-dlls.zip" `
          --title "Emacs $env:EMACS_VERSION (ucrt64)" `
          --target main `
          --notes "Upstream: https://github.com/emacs-mirror/emacs/commit/$env:EMACS_VERSION"
